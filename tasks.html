<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks - DoDone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"> 
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg dodone-nav">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html">
        <svg width="150" height="30" viewBox="0 0 150 30" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <style>
              /* Use CSS variables for theme responsiveness */
              .logo-text { font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: 20px; fill: var(--dodone-text-light); }
              .logo-dot { fill: var(--dodone-accent); }
            </style>
          </defs>
          <text x="0" y="20" class="logo-text">DoD<tspan class="logo-dot">o</tspan>ne</text>
        </svg>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="tasks.html"><i class="bi bi-journal-check"></i> Tasks</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="categories.html"><i class="bi bi-tags"></i> Categories</a>
          </li>
        </ul>
        <div class="d-flex align-items-center">
            <button class="btn btn-outline-secondary me-2" id="themeToggle" title="Toggle Theme">
                <i class="bi bi-brightness-high-fill" id="themeIcon"></i>
            </button>
            <div class="dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle fs-5"></i> <span id="navUsername">User</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                    <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person"></i> Profile</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                </ul>
            </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container my-5 flex-grow-1">
    <h1 class="mb-4">Task Management</h1>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#taskModal" id="addTaskBtn">
            <i class="bi bi-plus-circle"></i> Add New Task
        </button>
        <div class="d-flex gap-2">
            <select class="form-select form-select-sm" id="filterStatus" style="width: 150px;">
                <option value="">All Statuses</option>
                <option value="Overdue">Overdue</option>
                <option value="Due Today">Due Today</option>
                <option value="Due Tomorrow">Due Tomorrow</option>
                <option value="Pending">Pending</option>
                <option value="Submitted">Submitted</option>
                <option value="Completed">Completed</option>
            </select>
            <select class="form-select form-select-sm" id="filterCategory" style="width: 150px;">
                <option value="">All Categories</option>
                </select>
            <select class="form-select form-select-sm" id="filterPriority" style="width: 120px;">
                <option value="">All Priorities</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>
        </div>
    </div>

    <div class="card p-4 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th scope="col">Task Name</th>
                        <th scope="col">Category</th>
                        <th scope="col">Deadline</th>
                        <th scope="col">Priority</th>
                        <th scope="col">Status</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody id="tasksTableBody">
                    </tbody>
            </table>
        </div>
    </div>
  </main>

  <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="taskModalLabel">Add New Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="taskForm">
          <div class="modal-body">
            <input type="hidden" id="taskId">
            <div class="mb-3">
              <label for="taskName" class="form-label">Task Name</label>
              <input type="text" class="form-control" id="taskName" required>
            </div>
            <div class="mb-3">
              <label for="taskDesc" class="form-label">Description</label>
              <textarea class="form-control" id="taskDesc"></textarea>
            </div>
            <div class="mb-3">
              <label for="taskCategory" class="form-label">Category</label>
              <select class="form-select" id="taskCategory" required>
                </select>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="taskDeadline" class="form-label">Deadline</label>
                <input type="date" class="form-control" id="taskDeadline" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="taskPriority" class="form-label">Priority</label>
                <select class="form-select" id="taskPriority" required>
                  <option value="High">High</option>
                  <option value="Medium" selected>Medium</option>
                  <option value="Low">Low</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary">Save Task</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="submitModal" tabindex="-1" aria-labelledby="submitModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="submitModalLabel">Submit Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="submissionForm">
          <div class="modal-body">
            <p>Submitting for Task ID: <span id="submitTaskIdDisplay" class="fw-bold"></span> - <span id="submitTaskNameDisplay"></span></p>
            <input type="hidden" id="submitTaskId">
            <div class="mb-3">
              <label for="assignmentFile" class="form-label">Upload File</label>
              <input class="form-control" type="file" id="assignmentFile" required>
            </div>
            <div id="submissionMessage" class="alert alert-success d-none small"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Upload and Submit</button>
          </div>
        </form>
      </div>
    </div>
  </div>


  <footer class="text-center py-3 mt-auto">
    <small>DoDone • IMS566</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.checkAuth();
      window.renderTasks();
    });
  </script>
</body>
</html>
