<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile - DoDone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"> 
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg dodone-nav"> 
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html">
        <svg width="150" height="30" viewBox="0 0 150 30" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <style>
              .logo-text { font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: 20px; fill: var(--dodone-text-light); }
              .logo-dot { fill: var(--dodone-accent); }
            </style>
          </defs>
          <text x="0" y="20" class="logo-text">DoD<tspan class="logo-dot">o</tspan>ne</text>
        </svg>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="tasks.html"><i class="bi bi-journal-check"></i> Tasks</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="categories.html"><i class="bi bi-tags"></i> Categories</a>
          </li>
        </ul>
        <div class="d-flex align-items-center">
            <button class="btn btn-outline-secondary me-2" id="themeToggle" title="Toggle Theme">
                <i class="bi bi-brightness-high-fill" id="themeIcon"></i>
            </button>
            <div class="dropdown">
                <a class="nav-link dropdown-toggle active" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle fs-5"></i> <span id="navUsername">User</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                    <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person"></i> Profile</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                </ul>
            </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container my-5 flex-grow-1">
    <h1 class="mb-4">User Profile</h1>

    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm mb-4">
          <div class="card-body text-center p-4">
            <i class="bi bi-person-circle display-4 mb-3" style="color: var(--dodone-accent);"></i>
            <h4 id="profileFullName" class="card-title">Full Name</h4>
            <p class="card-text text-secondary"><i class="bi bi-person-badge"></i> <span id="profileRole">Role</span></p>
            <p class="card-text text-secondary"><i class="bi bi-at"></i> <span id="profileUsername">username</span></p>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-header">
            Update Profile Information
          </div>
          <form id="profileForm">
            <div class="card-body">
              <div id="profileSuccess" class="alert alert-success d-none small">Profile updated successfully!</div>
              <div id="profileError" class="alert alert-danger d-none small"></div>

              <div class="mb-3">
                <label for="newFullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="newFullName" required>
              </div>
              <div class="mb-3">
                <label for="newMatricNo" class="form-label">Matric/ID Number</label>
                <input type="text" class="form-control" id="newMatricNo" required>
              </div>
              <div class="mb-4">
                <label for="newRole" class="form-label">Program / Qualification</label>
                <select id="newRole" class="form-select" required>
                  <option value="Diploma">Diploma</option>
                  <option value="Degree">Degree</option>
                  <option value="Masters">Masters</option>
                  <option value="PHD">PHD</option>
                </select>
              </div>

              <hr>
              <h6>Change Password (Optional)</h6>
              <div class="mb-3 position-relative">
                  <label for="currentPassword" class="form-label">Current Password</label>
                  <input type="password" class="form-control pe-5" id="currentPassword">
                  <span class="password-toggle position-absolute top-50 end-0 translate-middle-y pe-3" title="Toggle Password Visibility">👁️</span>
              </div>
              <div class="mb-3 position-relative">
                  <label for="newPassword" class="form-label">New Password (Min 6 chars)</label>
                  <input type="password" class="form-control pe-5" id="newPassword" minlength="6">
                  <span class="password-toggle position-absolute top-50 end-0 translate-middle-y pe-3" title="Toggle Password Visibility">👁️</span>
              </div>
              <div class="mb-3 position-relative">
                  <label for="confirmPassword" class="form-label">Confirm New Password</label>
                  <input type="password" class="form-control pe-5" id="confirmPassword">
                  <span class="password-toggle position-absolute top-50 end-0 translate-middle-y pe-3" title="Toggle Password Visibility">👁️</span>
              </div>
              <div id="passwordError" class="alert alert-danger d-none small">Passwords do not match.</div>
            </div>
            
            <div class="card-footer text-end">
              <button type="submit" class="btn btn-primary" id="saveProfileBtn"><i class="bi bi-save"></i> Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>


  <footer class="text-center py-3 mt-auto">
    <small>DoDone • IMS566</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.checkAuth();
      window.renderProfile();
    });
  </script>
</body>
</html>
