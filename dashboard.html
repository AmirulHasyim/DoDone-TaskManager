<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - DoDone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"> 
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg dodone-nav">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html">
        <svg width="150" height="30" viewBox="0 0 150 30" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <style>
              /* Use CSS variables for theme responsiveness */
              .logo-text { font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: 20px; fill: var(--dodone-text-light); }
              .logo-dot { fill: var(--dodone-accent); }
            </style>
          </defs>
          <text x="0" y="20" class="logo-text">DoD<tspan class="logo-dot">o</tspan>ne</text>
        </svg>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="tasks.html"><i class="bi bi-journal-check"></i> Tasks</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="categories.html"><i class="bi bi-tags"></i> Categories</a>
          </li>
        </ul>
        <div class="d-flex align-items-center">
            <button class="btn btn-outline-secondary me-2" id="themeToggle" title="Toggle Theme">
                <i class="bi bi-brightness-high-fill" id="themeIcon"></i>
            </button>
            <div class="dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle fs-5"></i> <span id="navUsername">User</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                    <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person"></i> Profile</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                </ul>
            </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container my-5 flex-grow-1">
    <h1 class="mb-4">Dashboard</h1>

    <div class="row g-4 mb-5 text-center">
      <div class="col-6 col-md-3">
        <div class="card p-3 shadow-sm bg-danger-soft">
          <h6 class="mb-1">Overdue Tasks</h6>
          <h3 id="overdueTasks">0</h3>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3 shadow-sm bg-warning-soft">
          <h6 class="mb-1">Due Today/Tomorrow</h6>
          <h3 id="dueSoonTasks">0</h3>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3 shadow-sm bg-info-soft">
          <h6 class="mb-1">Total Tasks</h6>
          <h3 id="totalTasks">0</h3>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3 shadow-sm bg-success-soft">
          <h6 class="mb-1">Completed</h6>
          <h3 id="completedTasks">0</h3>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3 shadow-sm bg-primary-soft">
          <h6 class="mb-1">Submitted</h6>
          <h3 id="submittedTasks">0</h3>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3 shadow-sm bg-warning-soft">
          <h6 class="mb-1">Pending</h6>
          <h3 id="pendingTasks">0</h3>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3 shadow-sm bg-info-soft">
          <h6 class="mb-1">Total Categories</h6>
          <h3 id="totalCategories">0</h3>
        </div>
      </div>
    </div>

    <div class="card p-4"> 
      <h5>Task Status Overview & Categories</h5> 
      <div class="chart-container" style="height: 350px;">
        <canvas id="taskChart"></canvas>
      </div>
    </div>
  </main>

  <footer class="text-center py-3 mt-auto">
    <small>DoDone • IMS566</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.checkAuth();
      window.renderDashboardStats();
    });
  </script>
</body>
</html>
