<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DoDone - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"> 
  <link rel="stylesheet" href="css/style.css">
  <style>
    .password-toggle {
      font-size: 1.2rem;
      user-select: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow-sm" style="width: 380px;">
    <h3 class="text-center mb-3">
      <svg width="150" height="30" viewBox="0 0 150 30" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <style>
            .logo-text { font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: 20px; fill: var(--dodone-text-light); }
            .logo-dot { fill: var(--dodone-accent); }
          </style>
        </defs>
        <text x="0" y="20" class="logo-text">DoD<tspan class="logo-dot">o</tspan>ne</text>
      </svg>
    </h3>
    <h5 class="text-center mb-4 text-secondary">Student Task Manager</h5>
    
    <div id="loginError" class="alert alert-danger d-none small"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" type="text" class="form-control" required>
      </div>

      <div class="mb-4 position-relative">
        <label for="password" class="form-label">Password</label>
        <input id="password" type="password" class="form-control pe-5" required>
        <span class="password-toggle position-absolute top-50 end-0 translate-middle-y pe-3" title="Toggle Password Visibility">👁️</span>
      </div>

      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary">Login</button>
      </div>
    </form>

    <p class="text-center small mb-0">Don't have an account? <a href="register.html">Register here</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
